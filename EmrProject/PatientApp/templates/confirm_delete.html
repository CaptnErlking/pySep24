<!-- templates/confirm_delete.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Delete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container bg-white shadow p-5 rounded">
        <h2 class="text-danger">Are you sure you want to delete this patient?</h2>
        <p><strong>{{ patient.name }}</strong> (ID: {{ patient.custom_id }})</p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'list_patients' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
